name: Rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt

      - uses: actions-rust-lang/rustfmt@v1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ogis-ubuntu
          path: target/release/ogis

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --out xml --output-dir ./coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: rust
          fail_ci_if_error: false

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [format, clippy, build]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    environment:
      name: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.DOCKERHUB_USERNAME }}/ogis
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/ogis
          short-description: ${{ github.event.repository.description }}

  benchmark:
    name: Benchmark (${{ matrix.test }}/${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        test: [ogis, vercel-og]
        mode: [sequential, baseline, concurrent]
        include:
          - test: ogis
            port: 3000
          - test: vercel-og
            port: 3001

    steps:
      - uses: actions/checkout@v6

      - name: Start services
        uses: hoverkraft-tech/compose-action@v2
        with:
          compose-file: docker-compose.benchmark.yml

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Create results directory
        run: mkdir -p k6/results

      - name: Run benchmark
        run: k6 run k6/${{ matrix.test }}.js
        env:
          MODE: ${{ matrix.mode }}
          BASE_URL: http://localhost:${{ matrix.port }}

      - name: Add summary
        if: always()
        run: |
          echo "## ${{ matrix.test }} (${{ matrix.mode }})" >> $GITHUB_STEP_SUMMARY
          cat k6/results/summary.md >> $GITHUB_STEP_SUMMARY || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.test }}-${{ matrix.mode }}-${{ github.sha }}
          path: k6/results/

  openapi-sync:
    name: Sync OpenAPI Spec
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: ogis-ubuntu

      - name: Extract OpenAPI spec
        run: |
          chmod +x ogis
          ./ogis --export-openapi > docs/openapi.json

      - name: Create PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: docs/openapi.json
          commit-message: "chore: sync openapi.json"
          title: "chore: sync openapi.json"
          body: "Auto-generated PR to sync OpenAPI spec from Rust source."
          branch: chore/sync-openapi
          delete-branch: true