[package]
name = "ogis"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.7"
base64 = "0.22"
bytesize = "2.3.0"
clap = { version = "4.5.53", features = ["derive", "env"] }
cosmic-text = "0.15"
dotenvy = "0.15.7"
futures-util = "0.3.31"
hex = "0.4.3"
hickory-resolver = "0.25.2"
hmac = "0.12.1"
infer = "0.19.0"
ip_rfc = "0.1.0"
moka = { version = "0.12", features = ["future"] }
quick-xml = "0.38.4"
reqwest = { version = "0.12", features = ["default-tls", "stream"] }
resvg = "0.45.1"
saphyr = "0.0.6"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0.17"
tiny-skia = "0.11.4"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
url = "2.5"
usvg = "0.45.1"
utoipa = "5.4.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
