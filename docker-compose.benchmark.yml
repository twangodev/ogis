services:
  ogis:
    image: ${OGIS_IMAGE:-ogis:bench}
    build: .
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  vercel-og:
    build: ./comparisons/vercel-og
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  k6:
    image: grafana/k6:latest
    user: "${UID:-1000}:${GID:-1000}"
    profiles: [bench]
    depends_on:
      ogis:
        condition: service_healthy
    environment:
      MODE: ${MODE:-baseline}
      BASELINE_TEMPLATE: ${BASELINE_TEMPLATE:-minimal}
      BASE_URL: http://ogis:3000
      VUS: ${VUS:-10}
      DURATION: ${DURATION:-60s}
      REQUESTS_PER_TEMPLATE: ${REQUESTS_PER_TEMPLATE:-50}
    volumes:
      - .:/work
    working_dir: /work
    command: ["run", "k6/ogis.js"]

  k6-vercel-og:
    image: grafana/k6:latest
    user: "${UID:-1000}:${GID:-1000}"
    profiles: [bench-vercel-og]
    depends_on:
      vercel-og:
        condition: service_healthy
    environment:
      MODE: ${MODE:-baseline}
      BASELINE_TEMPLATE: ${BASELINE_TEMPLATE:-minimal}
      BASE_URL: http://vercel-og:3000
      VUS: ${VUS:-10}
      DURATION: ${DURATION:-60s}
      REQUESTS_PER_TEMPLATE: ${REQUESTS_PER_TEMPLATE:-50}
    volumes:
      - .:/work
    working_dir: /work
    command: ["run", "k6/vercel-og.js"]