<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Ultra clean white background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Centered vertical flow -->
  <g transform="translate(600, 60)">
    <!-- Logo at top (centered) -->
    <g id="ogis_logo" transform="translate(-200, 0)">
      <rect x="0" y="0" width="400" height="120"
            rx="12"
            fill="none"
            stroke="#d1d5db"
            stroke-width="2"
            stroke-dasharray="5,5"
            opacity="0.5"/>
      <text x="200" y="65"
            font-family="sans-serif"
            font-weight="bold"
            font-size="20"
            fill="#9ca3af"
            text-anchor="middle">
        Placeholder Logo (400×120)
      </text>
    </g>

    <!-- Subtitle -->
    <text id="ogis_subtitle" x="0" y="165" font-family="sans-serif" font-size="28" fill="#6b7280" text-anchor="middle">Placeholder Subtitle</text>

    <!-- Title -->
    <text x="0" y="250" font-family="sans-serif" font-size="80" font-weight="bold" fill="#111827" text-anchor="middle">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="300" font-family="sans-serif" font-size="28" fill="#9ca3af" text-anchor="middle">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>

    <!-- Image at bottom (centered) -->
    <g id="ogis_image" transform="translate(-100, 350)">
      <rect x="0" y="0" width="200" height="200"
            rx="12"
            fill="none"
            stroke="#d1d5db"
            stroke-width="2"
            stroke-dasharray="5,5"
            opacity="0.5"/>
      <text x="100" y="105"
            font-family="sans-serif"
            font-weight="bold"
            font-size="16"
            fill="#9ca3af"
            text-anchor="middle">
        Image (200×200)
      </text>
    </g>
  </g>
</svg>
