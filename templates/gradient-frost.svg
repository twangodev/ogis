<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <radialGradient id="blob1" cx="25%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob3" cx="55%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob4" cx="85%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob5" cx="15%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0"/>
    </radialGradient>

    <filter id="noiseCoarse" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-0.3"/></feComponentTransfer>
    </filter>
    <filter id="noiseFine" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="2" intercept="-0.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#baseGradient)"/>
  <rect width="100%" height="100%" fill="url(#blob5)"/>
  <rect width="100%" height="100%" fill="url(#blob3)"/>
  <rect width="100%" height="100%" fill="url(#blob1)"/>
  <rect width="100%" height="100%" fill="url(#blob2)"/>
  <rect width="100%" height="100%" fill="url(#blob4)"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseCoarse)" opacity="0.15"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseFine)" opacity="0.08"/>

  <!-- Minimal layout: clean, just text -->
  <g transform="translate(80, 0)">
    <text x="0" y="260" font-family="sans-serif" font-size="68" font-weight="bold" fill="#ffffff">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>
    <text x="0" y="340" font-family="sans-serif" font-size="28" fill="#ffffff" opacity="0.85">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
    <text id="ogis_subtitle" x="0" y="560" font-family="sans-serif" font-size="20" font-weight="600" fill="#ffffff" opacity="0.7">Placeholder Subtitle</text>
  </g>
</svg>