<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <radialGradient id="blob1" cx="70%" cy="30%" r="45%"><stop offset="0%" stop-color="#34d399" stop-opacity="0.7"/><stop offset="100%" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob2" cx="25%" cy="65%" r="40%"><stop offset="0%" stop-color="#10b981" stop-opacity="0.5"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob3" cx="85%" cy="75%" r="35%"><stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.6"/><stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob4" cx="40%" cy="20%" r="30%"><stop offset="0%" stop-color="#fdba74" stop-opacity="0.5"/><stop offset="100%" stop-color="#fdba74" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob5" cx="15%" cy="40%" r="28%"><stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.4"/><stop offset="100%" stop-color="#a7f3d0" stop-opacity="0"/></radialGradient>
    <filter id="noiseCoarse" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-0.3"/></feComponentTransfer></filter>
    <filter id="noiseFine" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="2" intercept="-0.5"/></feComponentTransfer></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#baseGradient)"/><rect width="100%" height="100%" fill="url(#blob1)"/><rect width="100%" height="100%" fill="url(#blob2)"/><rect width="100%" height="100%" fill="url(#blob3)"/><rect width="100%" height="100%" fill="url(#blob4)"/><rect width="100%" height="100%" fill="url(#blob5)"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseCoarse)" opacity="0.10"/><rect width="100%" height="100%" fill="#000" filter="url(#noiseFine)" opacity="0.05"/>
  <g id="ogis_logo">
    <rect x="60" y="100" width="300" height="80" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="210" y="145" font-family="sans-serif" font-weight="bold" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle">Placeholder Logo (300x80)</text>
  </g>
  <g transform="translate(60, 0)"><text id="ogis_subtitle" x="0" y="260" font-family="sans-serif" font-size="20" font-weight="600" fill="#e8fff4" opacity="0.9">Placeholder Subtitle</text><text x="0" y="340" font-family="sans-serif" font-size="68" font-weight="bold" fill="#ffffff"><tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan></text><text x="0" y="400" font-family="sans-serif" font-size="28" fill="#ffffff" opacity="0.85"><tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan></text></g>
  <g id="ogis_image">
    <rect x="680" y="100" width="440" height="430" rx="20" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="900" y="320" font-family="sans-serif" font-weight="bold" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">Image (440x430)</text>
