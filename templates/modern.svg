<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Clean gradient background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>

  <!-- Subtle geometric accent shapes -->
  <circle cx="150" cy="150" r="100" fill="#6366f1" opacity="0.06"/>
  <rect x="950" y="450" width="180" height="180" fill="#ec4899" opacity="0.05" transform="rotate(15 1040 540)"/>

  <!-- Logo at top-left -->
  <g id="ogis_logo">
    <rect x="80" y="80" width="400" height="120"
          rx="16"
          fill="#ffffff"
          stroke="#cbd5e1"
          stroke-width="2"/>
    <text x="280" y="145"
          font-family="sans-serif"
          font-weight="bold"
          font-size="20"
          fill="#475569"
          text-anchor="middle">
      Placeholder Logo (400×120)
    </text>
  </g>

  <!-- Image at top-right -->
  <g id="ogis_image">
    <rect x="920" y="80" width="200" height="200"
          rx="16"
          fill="#ffffff"
          stroke="#cbd5e1"
          stroke-width="2"/>
    <text x="1020" y="185"
          font-family="sans-serif"
          font-weight="bold"
          font-size="16"
          fill="#64748b"
          text-anchor="middle">
      Image (200×200)
    </text>
  </g>

  <!-- Content at bottom-left -->
  <g transform="translate(80, 380)">
    <!-- Subtitle -->
    <text id="ogis_subtitle" x="0" y="0" font-family="sans-serif" font-size="28" fill="#64748b">Placeholder Subtitle</text>

    <!-- Title -->
    <text x="0" y="95" font-family="sans-serif" font-size="80" font-weight="bold" fill="#0f172a">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="150" font-family="sans-serif" font-size="28" fill="#475569">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
  </g>
</svg>
