<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1929"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>

    <radialGradient id="blob1" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="65%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob3" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob4" cx="40%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob5" cx="90%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>

    <filter id="noiseCoarse" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-0.3"/></feComponentTransfer>
    </filter>
    <filter id="noiseFine" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="2" intercept="-0.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#baseGradient)"/>
  <rect width="100%" height="100%" fill="url(#blob1)"/>
  <rect width="100%" height="100%" fill="url(#blob4)"/>
  <rect width="100%" height="100%" fill="url(#blob2)"/>
  <rect width="100%" height="100%" fill="url(#blob3)"/>
  <rect width="100%" height="100%" fill="url(#blob5)"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseCoarse)" opacity="0.18"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseFine)" opacity="0.10"/>

  <!-- Diagonal layout: text bottom-left, large image top-right -->
  <g id="ogis_image">
    <rect x="580" y="50" width="560" height="340" rx="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="860" y="220" font-family="sans-serif" font-weight="bold" font-size="18" fill="rgba(255,255,255,0.5)" text-anchor="middle">Image (560x340)</text>
  </g>
  <g id="ogis_logo">
    <rect x="60" y="50" width="300" height="80" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="210" y="98" font-family="sans-serif" font-weight="bold" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle">Logo (300x80)</text>
  </g>
  <g transform="translate(60, 0)">
    <text id="ogis_subtitle" x="0" y="420" font-family="sans-serif" font-size="22" font-weight="600" fill="#ffffff" opacity="0.9">Placeholder Subtitle</text>
    <text x="0" y="500" font-family="sans-serif" font-size="60" font-weight="bold" fill="#ffffff">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>
    <text x="0" y="560" font-family="sans-serif" font-size="24" fill="#ffffff" opacity="0.85">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
  </g>
</svg>