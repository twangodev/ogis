<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006666"/>
      <stop offset="100%" stop-color="#008080"/>
    </linearGradient>

    <!-- Water ripples pattern -->
    <radialGradient id="blob1" cx="30%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#40e0d0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#40e0d0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#48d1cc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#48d1cc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob3" cx="30%" cy="50%" r="25%">
      <stop offset="0%" stop-color="#20b2aa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#20b2aa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob4" cx="55%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#7fffd4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7fffd4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob5" cx="45%" cy="75%" r="30%">
      <stop offset="0%" stop-color="#afeeee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#afeeee" stop-opacity="0"/>
    </radialGradient>

    <filter id="noiseCoarse" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-0.3"/></feComponentTransfer>
    </filter>
    <filter id="noiseFine" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="2" intercept="-0.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#baseGradient)"/>
  <rect width="100%" height="100%" fill="url(#blob1)"/>
  <rect width="100%" height="100%" fill="url(#blob2)"/>
  <rect width="100%" height="100%" fill="url(#blob3)"/>
  <rect width="100%" height="100%" fill="url(#blob4)"/>
  <rect width="100%" height="100%" fill="url(#blob5)"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseCoarse)" opacity="0.18"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseFine)" opacity="0.10"/>

  <!-- Split layout -->
  <g id="ogis_logo">
    <rect x="60" y="100" width="300" height="80" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="210" y="148" font-family="sans-serif" font-weight="bold" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle">Placeholder Logo (300x80)</text>
  </g>
  <g transform="translate(60, 0)">
    <text id="ogis_subtitle" x="0" y="260" font-family="sans-serif" font-size="22" font-weight="600" fill="#ffffff" opacity="0.9">Placeholder Subtitle</text>
    <text x="0" y="340" font-family="sans-serif" font-size="54" font-weight="bold" fill="#ffffff">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>
    <text x="0" y="400" font-family="sans-serif" font-size="24" fill="#ffffff" opacity="0.85">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
  </g>
  <g id="ogis_image">
    <rect x="680" y="100" width="440" height="430" rx="20" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="900" y="325" font-family="sans-serif" font-weight="bold" font-size="18" fill="rgba(255,255,255,0.5)" text-anchor="middle">Image (440x430)</text>
  </g>
</svg>