<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#be185d"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <radialGradient id="blob1" cx="80%" cy="25%" r="42%"><stop offset="0%" stop-color="#14b8a6" stop-opacity="0.7"/><stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob2" cx="20%" cy="70%" r="45%"><stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.5"/><stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob3" cx="55%" cy="45%" r="38%"><stop offset="0%" stop-color="#f472b6" stop-opacity="0.6"/><stop offset="100%" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob4" cx="90%" cy="80%" r="32%"><stop offset="0%" stop-color="#5eead4" stop-opacity="0.4"/><stop offset="100%" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob5" cx="10%" cy="30%" r="30%"><stop offset="0%" stop-color="#db2777" stop-opacity="0.5"/><stop offset="100%" stop-color="#db2777" stop-opacity="0"/></radialGradient>
    <filter id="noiseCoarse" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-0.3"/></feComponentTransfer></filter>
    <filter id="noiseFine" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="2" intercept="-0.5"/></feComponentTransfer></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#baseGradient)"/><rect width="100%" height="100%" fill="url(#blob1)"/><rect width="100%" height="100%" fill="url(#blob2)"/><rect width="100%" height="100%" fill="url(#blob3)"/><rect width="100%" height="100%" fill="url(#blob4)"/><rect width="100%" height="100%" fill="url(#blob5)"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseCoarse)" opacity="0.12"/><rect width="100%" height="100%" fill="#000" filter="url(#noiseFine)" opacity="0.06"/>
  <g id="ogis_logo">
    <rect x="60" y="100" width="300" height="80" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="210" y="145" font-family="sans-serif" font-weight="bold" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle">Placeholder Logo (300x80)</text>
  </g>
  <g transform="translate(60, 0)"><text id="ogis_subtitle" x="0" y="260" font-family="sans-serif" font-size="20" font-weight="600" fill="#c0f5ed" opacity="0.9">Placeholder Subtitle</text><text x="0" y="340" font-family="sans-serif" font-size="68" font-weight="bold" fill="#ffffff"><tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan></text><text x="0" y="400" font-family="sans-serif" font-size="28" fill="#ffffff" opacity="0.85"><tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan></text></g>
  <g id="ogis_image">
    <rect x="680" y="100" width="440" height="430" rx="20" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="900" y="320" font-family="sans-serif" font-weight="bold" font-size="16" fill="rgba(255,255,255,0.5)" text-anchor="middle">Image (440x430)</text>
