<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7d8471"/><stop offset="100%" stop-color="#9caf88"/></linearGradient>
    <radialGradient id="blob1" cx="70%" cy="30%" r="45%"><stop offset="0%" stop-color="#cd5c45" stop-opacity="0.7"/><stop offset="100%" stop-color="#cd5c45" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob2" cx="25%" cy="65%" r="42%"><stop offset="0%" stop-color="#e07850" stop-opacity="0.5"/><stop offset="100%" stop-color="#e07850" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob3" cx="50%" cy="20%" r="38%"><stop offset="0%" stop-color="#b2ac88" stop-opacity="0.6"/><stop offset="100%" stop-color="#b2ac88" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob4" cx="85%" cy="70%" r="32%"><stop offset="0%" stop-color="#c4a484" stop-opacity="0.4"/><stop offset="100%" stop-color="#c4a484" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob5" cx="15%" cy="80%" r="30%"><stop offset="0%" stop-color="#a67b5b" stop-opacity="0.5"/><stop offset="100%" stop-color="#a67b5b" stop-opacity="0"/></radialGradient>
    <filter id="noiseCoarse" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-0.3"/></feComponentTransfer></filter>
    <filter id="noiseFine" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="2" intercept="-0.5"/></feComponentTransfer></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#baseGradient)"/><rect width="100%" height="100%" fill="url(#blob1)"/><rect width="100%" height="100%" fill="url(#blob2)"/><rect width="100%" height="100%" fill="url(#blob3)"/><rect width="100%" height="100%" fill="url(#blob4)"/><rect width="100%" height="100%" fill="url(#blob5)"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseCoarse)" opacity="0.10"/><rect width="100%" height="100%" fill="#000" filter="url(#noiseFine)" opacity="0.05"/>
  <g id="ogis_logo">
    <rect x="450" y="50" width="300" height="80" rx="10" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="600" y="95" font-family="sans-serif" font-weight="bold" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle">Placeholder Logo (300x80)</text>
  </g>
  <text id="ogis_subtitle" x="600" y="200" font-family="sans-serif" font-size="20" font-weight="600" fill="#fff5eb" opacity="0.8" text-anchor="middle">Placeholder Subtitle</text>
  <text x="600" y="340" font-family="sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle"><tspan id="ogis_title">Placeholder Title</tspan></text>
  <text x="600" y="410" font-family="sans-serif" font-size="28" fill="#ffeedd" opacity="0.85" text-anchor="middle"><tspan id="ogis_description">Placeholder Description</tspan></text>
</svg>