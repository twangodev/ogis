<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Base gradient -->
        <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0615"/>
            <stop offset="100%" stop-color="#0f0f23"/>
        </linearGradient>

        <!-- Blob gradients (dark purple palette, similar to original) -->
        <radialGradient id="blob1" cx="120%" cy="120%" r="80%">
            <stop offset="0%" stop-color="#6b21a8" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#6b21a8" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="blob2" cx="15%" cy="70%" r="45%">
            <stop offset="0%" stop-color="#581c87" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
        </radialGradient>

        <radialGradient id="blob3" cx="50%" cy="20%" r="40%">
            <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
        </radialGradient>

        <!-- Noise filters -->
        <filter id="noiseCoarse" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-0.3"/></feComponentTransfer>
        </filter>
        <filter id="noiseFine" x="0%" y="0%" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer><feFuncA type="linear" slope="2" intercept="-0.5"/></feComponentTransfer>
        </filter>

        <!-- Waveform fade gradients (white to dark purple) -->
        <linearGradient id="waveUp" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#5b3a8a" stop-opacity="0" />
            <stop offset="40%" stop-color="#9ca3af" stop-opacity="0.15" />
            <stop offset="70%" stop-color="#d1d5db" stop-opacity="0.5" />
            <stop offset="90%" stop-color="#ffffff" stop-opacity="1" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
        </linearGradient>
        <linearGradient id="waveDown" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
            <stop offset="50%" stop-color="#9ca3af" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#5b3a8a" stop-opacity="0" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#baseGradient)"/>

    <!-- Organic color blobs (purple tones) -->
    <rect width="100%" height="100%" fill="url(#blob1)"/>
    <rect width="100%" height="100%" fill="url(#blob2)"/>
    <rect width="100%" height="100%" fill="url(#blob3)"/>

    <!-- Noise layers (subtle) -->
    <rect width="100%" height="100%" fill="#000" filter="url(#noiseCoarse)" opacity="0.1"/>
    <rect width="100%" height="100%" fill="#000" filter="url(#noiseFine)" opacity="0.05"/>

    <g id="ogis_logo">
        <rect x="60" y="50" width="400" height="120"
              rx="12"
              fill="rgba(255,255,255,0.1)"
              stroke="rgba(255,255,255,0.2)"
              stroke-width="1"/>
        <text x="260" y="115"
              font-family="sans-serif"
              font-weight="bold"
              font-size="18"
              fill="rgba(255,255,255,0.5)"
              text-anchor="middle">
            Placeholder Logo (400x120)
        </text>
    </g>

    <g id="ogis_image">
        <rect x="940" y="50" width="200" height="200"
              rx="12"
              fill="rgba(255,255,255,0.1)"
              stroke="rgba(255,255,255,0.2)"
              stroke-width="1"/>
        <text x="1040" y="155"
              font-family="sans-serif"
              font-weight="bold"
              font-size="14"
              fill="rgba(255,255,255,0.5)"
              text-anchor="middle">
            Image (200x200)
        </text>
    </g>

    <!-- Content area -->
    <g transform="translate(60, 0)">
        <text id="ogis_subtitle" x="0" y="440"
              font-family="sans-serif"
              font-size="24"
              font-weight="600"
              fill="#ffffff"
              opacity="0.9">
            Placeholder Subtitle
        </text>

        <text x="0" y="520"
              font-family="sans-serif"
              font-size="72"
              font-weight="bold"
              fill="#ffffff">
            <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
        </text>

        <text x="0" y="580"
              font-family="sans-serif"
              font-size="26"
              fill="#ffffff"
              opacity="0.85">
            <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
        </text>
    </g>

