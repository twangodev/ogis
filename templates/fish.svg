<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="bgGradient" cx="120%" cy="120%" r="80%">
            <stop offset="0%" style="stop-color:#764ba2;stop-opacity:0.6" />
            <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:0" />
        </radialGradient>

        <!-- Waveform gradients -->
        <linearGradient id="waveUp" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#808080;stop-opacity:0" />
            <stop offset="40%" style="stop-color:#808080;stop-opacity:0.15" />
            <stop offset="70.5%" style="stop-color:#808080;stop-opacity:0.5" />
            <stop offset="90%" style="stop-color:#808080;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="waveDown" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#808080;stop-opacity:0.3" />
            <stop offset="60%" style="stop-color:#808080;stop-opacity:0.05" />
            <stop offset="100%" style="stop-color:#808080;stop-opacity:0" />
        </linearGradient>
    </defs>

    <!-- Background with gradient weighted to bottom-right -->
    <rect width="100%" height="100%" fill="#0a0615"/>
