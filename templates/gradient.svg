<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top-left corner: Pink -->
    <radialGradient id="gradientTL" cx="15%" cy="15%" r="70%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0" />
    </radialGradient>

    <!-- Top-right corner: Yellow -->
    <radialGradient id="gradientTR" cx="85%" cy="15%" r="70%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>

    <!-- Bottom-left corner: Blue -->
    <radialGradient id="gradientBL" cx="15%" cy="85%" r="70%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0" />
    </radialGradient>

    <!-- Bottom-right corner: Purple -->
    <radialGradient id="gradientBR" cx="85%" cy="85%" r="70%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Layer gradients from all 4 corners -->
  <rect width="100%" height="100%" fill="url(#gradientTL)"/>
  <rect width="100%" height="100%" fill="url(#gradientTR)"/>
  <rect width="100%" height="100%" fill="url(#gradientBL)"/>
  <rect width="100%" height="100%" fill="url(#gradientBR)"/>

  <!-- Logo at top-left -->
  <g id="ogis_logo">
    <rect x="80" y="80" width="400" height="120"
          rx="12"
          fill="rgba(255,255,255,0.15)"
          stroke="#ffffff"
          stroke-width="2"
          opacity="0.9"/>
    <text x="280" y="145"
          font-family="sans-serif"
          font-weight="bold"
          font-size="20"
          fill="#ffffff"
          text-anchor="middle">
      Placeholder Logo (400×120)
    </text>
  </g>

  <!-- Image at top-right -->
  <g id="ogis_image">
    <rect x="920" y="80" width="200" height="200"
          rx="12"
          fill="rgba(255,255,255,0.15)"
          stroke="#ffffff"
          stroke-width="2"
          opacity="0.9"/>
    <text x="1020" y="185"
          font-family="sans-serif"
          font-weight="bold"
          font-size="16"
          fill="#ffffff"
          text-anchor="middle">
      Image (200×200)
    </text>
  </g>

  <!-- Content at bottom-left -->
  <g transform="translate(80, 380)">
    <!-- Subtitle -->
    <text id="ogis_subtitle" x="0" y="0" font-family="sans-serif" font-size="28" fill="#ffffff" opacity="0.9">Placeholder Subtitle</text>

    <!-- Title -->
    <text x="0" y="95" font-family="sans-serif" font-size="80" font-weight="bold" fill="#ffffff">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="150" font-family="sans-serif" font-size="28" fill="#ffffff" opacity="0.95">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
  </g>
</svg>
