<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <radialGradient id="blob1" cx="25%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="70%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3f3f46" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob3" cx="50%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#52525b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#52525b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob4" cx="85%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#71717a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob5" cx="15%" cy="75%" r="35%">
      <stop offset="0%" stop-color="#a1a1aa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a1a1aa" stop-opacity="0"/>
    </radialGradient>

    <filter id="noiseCoarse" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-0.3"/></feComponentTransfer>
    </filter>
    <filter id="noiseFine" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="2" intercept="-0.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#baseGradient)"/>
  <rect width="100%" height="100%" fill="url(#blob1)"/>
  <rect width="100%" height="100%" fill="url(#blob2)"/>
  <rect width="100%" height="100%" fill="url(#blob3)"/>
  <rect width="100%" height="100%" fill="url(#blob4)"/>
  <rect width="100%" height="100%" fill="url(#blob5)"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseCoarse)" opacity="0.12"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseFine)" opacity="0.08"/>

  <!-- Minimal layout: stark, dramatic -->
  <g transform="translate(80, 0)">
    <text x="0" y="280" font-family="sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>
    <text x="0" y="360" font-family="sans-serif" font-size="28" fill="#ffffff" opacity="0.7">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
    <text id="ogis_subtitle" x="0" y="570" font-family="sans-serif" font-size="18" font-weight="500" fill="#a1a1aa" opacity="0.8">Placeholder Subtitle</text>
  </g>
</svg>