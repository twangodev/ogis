<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
<!-- ogis_gradient_defs -->
  </defs>

<!-- ogis_background_layers -->

  <g id="ogis_logo">
    <rect x="60" y="30" width="240" height="60"
          rx="8"
          fill="rgba(255,255,255,0.1)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>
    <text x="180" y="66"
          font-family="sans-serif"
          font-weight="bold"
          font-size="12"
          fill="rgba(255,255,255,0.5)"
          text-anchor="middle">
      Placeholder Logo (240x60)
    </text>
  </g>

  <text id="ogis_subtitle" x="340" y="68"
        font-family="sans-serif"
        font-size="22"
        font-weight="600"
        fill="{{subtitle_color}}"
        opacity="{{subtitle_opacity}}">
    Placeholder Subtitle
  </text>

  <line x1="60" y1="110" x2="1140" y2="110"
        stroke="{{subtitle_color}}"
        stroke-opacity="0.25"
        stroke-width="1.5"/>

  <g>
    <text x="600" y="320"
          font-family="sans-serif"
          font-size="80"
          font-weight="bold"
          fill="{{title_color}}"
          text-anchor="middle">
      <tspan id="ogis_title">Placeholder Title</tspan>
    </text>

    <text x="600" y="400"
          font-family="sans-serif"
          font-size="26"
          fill="{{desc_color}}"
          opacity="{{desc_opacity}}"
          text-anchor="middle">
      <tspan id="ogis_description">Placeholder Description</tspan>
    </text>
  </g>

  <g id="ogis_image">
    <rect x="450" y="450" width="300" height="140"
          rx="12"
          fill="rgba(255,255,255,0.1)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>
    <text x="600" y="525"
          font-family="sans-serif"
          font-weight="bold"
          font-size="14"
          fill="rgba(255,255,255,0.5)"
          text-anchor="middle">
      Image (300x140)
    </text>
  </g>
</svg>
