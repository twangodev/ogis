<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
<!-- ogis_gradient_defs -->
  </defs>

<!-- ogis_background_layers -->

  <g id="ogis_logo">
    <rect x="60" y="50" width="400" height="120"
          rx="12"
          fill="rgba(255,255,255,0.1)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>
    <text x="260" y="115"
          font-family="sans-serif"
          font-weight="bold"
          font-size="18"
          fill="rgba(255,255,255,0.5)"
          text-anchor="middle">
      Placeholder Logo (400x120)
    </text>
  </g>

  <g id="ogis_image">
    <rect x="940" y="50" width="200" height="200"
          rx="12"
          fill="rgba(255,255,255,0.1)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>
    <text x="1040" y="155"
          font-family="sans-serif"
          font-weight="bold"
          font-size="14"
          fill="rgba(255,255,255,0.5)"
          text-anchor="middle">
      Image (200x200)
    </text>
  </g>

  <g transform="translate(60, 0)">
    <text id="ogis_subtitle" x="0" y="440"
          font-family="sans-serif"
          font-size="24"
          font-weight="600"
          fill="{{subtitle_color}}"
          opacity="{{subtitle_opacity}}">
      Placeholder Subtitle
    </text>

    <text x="0" y="520"
          font-family="sans-serif"
          font-size="72"
          font-weight="bold"
          fill="{{title_color}}">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>

    <text x="0" y="580"
          font-family="sans-serif"
          font-size="26"
          fill="{{desc_color}}"
          opacity="{{desc_opacity}}">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
  </g>
</svg>
