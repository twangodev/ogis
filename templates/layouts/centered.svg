<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
<!-- ogis_gradient_defs -->
  </defs>

<!-- ogis_background_layers -->

  <g id="ogis_logo">
    <rect x="450" y="50" width="300" height="80"
          rx="10"
          fill="rgba(255,255,255,0.08)"
          stroke="rgba(255,255,255,0.15)"
          stroke-width="1"/>
    <text x="600" y="98"
          font-family="sans-serif"
          font-weight="bold"
          font-size="14"
          fill="rgba(255,255,255,0.4)"
          text-anchor="middle">
      Placeholder Logo (300x80)
    </text>
  </g>

  <g>
    <text id="ogis_subtitle" x="600" y="220"
          font-family="sans-serif"
          font-size="28"
          font-weight="600"
          fill="{{subtitle_color}}"
          opacity="{{subtitle_opacity}}"
          text-anchor="middle">
      Placeholder Subtitle
    </text>

    <text x="600" y="340"
          font-family="sans-serif"
          font-size="86"
          font-weight="bold"
          fill="{{title_color}}"
          text-anchor="middle">
      <tspan id="ogis_title">Placeholder Title</tspan>
    </text>

    <text x="600" y="420"
          font-family="sans-serif"
          font-size="28"
          fill="{{desc_color}}"
          opacity="{{desc_opacity}}"
          text-anchor="middle">
      <tspan id="ogis_description">Placeholder Description</tspan>
    </text>
  </g>
</svg>
