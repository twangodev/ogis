<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
<!-- ogis_gradient_defs -->
  </defs>

<!-- ogis_background_layers -->

  <g>
    <text x="600" y="160"
          font-family="sans-serif"
          font-size="76"
          font-weight="bold"
          fill="{{title_color}}"
          text-anchor="middle">
      <tspan id="ogis_title">Placeholder Title</tspan>
    </text>

    <text x="600" y="240"
          font-family="sans-serif"
          font-size="26"
          fill="{{desc_color}}"
          opacity="{{desc_opacity}}"
          text-anchor="middle">
      <tspan id="ogis_description">Placeholder Description</tspan>
    </text>
  </g>

  <g id="ogis_image">
    <rect x="400" y="280" width="400" height="180"
          rx="16"
          fill="rgba(255,255,255,0.1)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>
    <text x="600" y="375"
          font-family="sans-serif"
          font-weight="bold"
          font-size="14"
          fill="rgba(255,255,255,0.5)"
          text-anchor="middle">
      Image (400x180)
    </text>
  </g>

  <rect x="0" y="500" width="1200" height="130"
        fill="{{subtitle_color}}"
        fill-opacity="0.1"/>

  <g id="ogis_logo">
    <rect x="60" y="520" width="200" height="60"
          rx="8"
          fill="rgba(255,255,255,0.08)"
          stroke="rgba(255,255,255,0.15)"
          stroke-width="1"/>
    <text x="160" y="556"
          font-family="sans-serif"
          font-weight="bold"
          font-size="12"
          fill="rgba(255,255,255,0.4)"
          text-anchor="middle">
      Placeholder Logo (200x60)
    </text>
  </g>

  <text id="ogis_subtitle" x="300" y="558"
        font-family="sans-serif"
        font-size="20"
        font-weight="600"
        fill="{{subtitle_color}}"
        opacity="{{subtitle_opacity}}">
    Placeholder Subtitle
  </text>
</svg>
