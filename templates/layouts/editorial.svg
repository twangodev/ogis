<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
<!-- ogis_gradient_defs -->
  </defs>

<!-- ogis_background_layers -->

  <g id="ogis_logo">
    <rect x="60" y="60" width="280" height="70"
          rx="8"
          fill="rgba(255,255,255,0.1)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>
    <text x="200" y="100"
          font-family="sans-serif"
          font-weight="bold"
          font-size="14"
          fill="rgba(255,255,255,0.5)"
          text-anchor="middle">
      Placeholder Logo (280x70)
    </text>
  </g>

  <line x1="620" y1="60" x2="620" y2="570"
        stroke="{{subtitle_color}}"
        stroke-opacity="0.3"
        stroke-width="2"/>

  <g transform="translate(60, 0)">
    <text id="ogis_subtitle" x="0" y="220"
          font-family="sans-serif"
          font-size="20"
          font-weight="600"
          fill="{{subtitle_color}}"
          opacity="{{subtitle_opacity}}">
      Placeholder Subtitle
    </text>

    <text x="0" y="310"
          font-family="sans-serif"
          font-size="60"
          font-weight="bold"
          fill="{{title_color}}">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>

    <text x="0" y="380"
          font-family="sans-serif"
          font-size="24"
          fill="{{desc_color}}"
          opacity="{{desc_opacity}}">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
  </g>

  <g id="ogis_image">
    <rect x="680" y="115" width="460" height="400"
          rx="16"
          fill="rgba(255,255,255,0.1)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>
    <text x="910" y="320"
          font-family="sans-serif"
          font-weight="bold"
          font-size="16"
          fill="rgba(255,255,255,0.5)"
          text-anchor="middle">
      Image (460x400)
    </text>
  </g>
</svg>
