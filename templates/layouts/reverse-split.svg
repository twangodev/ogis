<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
<!-- ogis_gradient_defs -->
  </defs>

<!-- ogis_background_layers -->

  <g id="ogis_image">
    <rect x="80" y="100" width="440" height="430"
          rx="20"
          fill="rgba(255,255,255,0.1)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>
    <text x="300" y="320"
          font-family="sans-serif"
          font-weight="bold"
          font-size="16"
          fill="rgba(255,255,255,0.5)"
          text-anchor="middle">
      Image (440x430)
    </text>
  </g>

  <g id="ogis_logo">
    <rect x="600" y="100" width="300" height="80"
          rx="8"
          fill="rgba(255,255,255,0.1)"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>
    <text x="750" y="145"
          font-family="sans-serif"
          font-weight="bold"
          font-size="14"
          fill="rgba(255,255,255,0.5)"
          text-anchor="middle">
      Placeholder Logo (300x80)
    </text>
  </g>

  <g transform="translate(1140, 0)">
    <text id="ogis_subtitle" x="0" y="260"
          font-family="sans-serif"
          font-size="20"
          font-weight="600"
          fill="{{subtitle_color}}"
          opacity="{{subtitle_opacity}}"
          text-anchor="end">
      Placeholder Subtitle
    </text>

    <text x="0" y="340"
          font-family="sans-serif"
          font-size="68"
          font-weight="bold"
          fill="{{title_color}}"
          text-anchor="end">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>

    <text x="0" y="400"
          font-family="sans-serif"
          font-size="28"
          fill="{{desc_color}}"
          opacity="{{desc_opacity}}"
          text-anchor="end">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
  </g>
</svg>
