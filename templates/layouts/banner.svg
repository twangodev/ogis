<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
<!-- ogis_gradient_defs -->
  </defs>

<!-- ogis_background_layers -->

  <g id="ogis_logo">
    <rect x="40" y="30" width="200" height="60"
          rx="8"
          fill="rgba(255,255,255,0.08)"
          stroke="rgba(255,255,255,0.15)"
          stroke-width="1"/>
    <text x="140" y="66"
          font-family="sans-serif"
          font-weight="bold"
          font-size="12"
          fill="rgba(255,255,255,0.4)"
          text-anchor="middle">
      Placeholder Logo (200x60)
    </text>
  </g>

  <g>
    <text x="600" y="340"
          font-family="sans-serif"
          font-size="100"
          font-weight="bold"
          fill="{{title_color}}"
          text-anchor="middle">
      <tspan id="ogis_title">Placeholder Title</tspan>
    </text>

    <text x="600" y="420"
          font-family="sans-serif"
          font-size="24"
          fill="{{desc_color}}"
          opacity="{{desc_opacity}}"
          text-anchor="middle">
      <tspan id="ogis_description">Placeholder Description</tspan>
    </text>

    <text id="ogis_subtitle" x="600" y="560"
          font-family="sans-serif"
          font-size="20"
          font-weight="600"
          fill="{{subtitle_color}}"
          opacity="{{subtitle_opacity}}"
          text-anchor="middle">
      Placeholder Subtitle
    </text>
  </g>
</svg>
