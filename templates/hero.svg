<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Background image placeholder -->
  <g id="ogis_image">
    <rect width="1200" height="630" fill="#1e293b"/>
    <text x="600" y="315"
          font-family="sans-serif"
          font-weight="bold"
          font-size="32"
          fill="#475569"
          text-anchor="middle">
      Background Image (1200×630)
    </text>
  </g>

  <!-- Semi-transparent dark overlay for text readability -->
  <rect width="100%" height="100%" fill="url(#overlay)"/>

  <!-- Logo at top-left -->
  <g id="ogis_logo">
    <rect x="80" y="60" width="400" height="120"
          rx="12"
          fill="rgba(255,255,255,0.1)"
          stroke="#ffffff"
          stroke-width="2"
          opacity="0.8"/>
    <text x="280" y="125"
          font-family="sans-serif"
          font-weight="bold"
          font-size="20"
          fill="#ffffff"
          text-anchor="middle">
      Placeholder Logo (400×120)
    </text>
  </g>

  <!-- Content centered or left-aligned -->
  <g transform="translate(80, 340)">
    <!-- Subtitle -->
    <text id="ogis_subtitle" x="0" y="0" font-family="sans-serif" font-size="32" fill="#e2e8f0">Placeholder Subtitle</text>

    <!-- Title -->
    <text x="0" y="100" font-family="sans-serif" font-size="90" font-weight="bold" fill="#ffffff">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="160" font-family="sans-serif" font-size="30" fill="#f1f5f9">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
  </g>
</svg>
