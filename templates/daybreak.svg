<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGradient" cx="0%" cy="0%" r="70%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f3f4f6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background with gradient weighted to top-left -->
  <rect width="100%" height="100%" fill="#f9fafb"/>
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>

  <!-- Content area on top-left -->
  <g transform="translate(80, 80)">
    <!-- Subtitle -->
    <text id="ogis_subtitle" x="0" y="0" font-family="sans-serif" font-size="28" fill="#6b7280">Placeholder Subtitle</text>

    <!-- Title -->
    <text x="0" y="95" font-family="sans-serif" font-size="80" font-weight="bold" fill="#111827">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="150" font-family="sans-serif" font-size="28" fill="#4b5563">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
  </g>

  <g id="ogis_logo">
    <rect x="80" y="470" width="400" height="120"
          rx="12"
          fill="none"
          stroke="#f59e0b"
          stroke-width="2"
          stroke-dasharray="5,5"
          opacity="0.3"/>
    <text x="280" y="535"
          font-family="sans-serif"
          font-weight="bold"
          font-size="20"
          fill="#f59e0b"
          text-anchor="middle">
      Placeholder Logo (400×120)
    </text>
  </g>

  <g id="ogis_image">
    <rect x="920" y="380" width="200" height="200"
          rx="12"
          fill="none"
          stroke="#ea580c"
          stroke-width="2"
          stroke-dasharray="5,5"
          opacity="0.3"/>
    <text x="1020" y="485"
          font-family="sans-serif"
          font-weight="bold"
          font-size="16"
          fill="#ea580c"
          text-anchor="middle">
      Image (200×200)
    </text>
  </g>
</svg>