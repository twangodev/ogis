<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>

    <radialGradient id="blob1" cx="35%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="65%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#9f1239" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob3" cx="80%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#be123c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob4" cx="20%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#4c0519" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4c0519" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob5" cx="50%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>

    <filter id="noiseCoarse" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-0.3"/></feComponentTransfer>
    </filter>
    <filter id="noiseFine" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="2" intercept="-0.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#baseGradient)"/>
  <rect width="100%" height="100%" fill="url(#blob4)"/>
  <rect width="100%" height="100%" fill="url(#blob1)"/>
  <rect width="100%" height="100%" fill="url(#blob2)"/>
  <rect width="100%" height="100%" fill="url(#blob3)"/>
  <rect width="100%" height="100%" fill="url(#blob5)"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseCoarse)" opacity="0.18"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseFine)" opacity="0.10"/>

  <!-- Centered layout: elegant and balanced -->
  <g id="ogis_logo">
    <rect x="450" y="70" width="300" height="80" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="600" y="118" font-family="sans-serif" font-weight="bold" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="middle">Logo (300x80)</text>
  </g>
  <g>
    <text id="ogis_subtitle" x="600" y="270" font-family="sans-serif" font-size="22" font-weight="600" fill="#ffffff" opacity="0.85" text-anchor="middle">Placeholder Subtitle</text>
    <text x="600" y="360" font-family="sans-serif" font-size="68" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <tspan id="ogis_title">Placeholder Title</tspan>
    </text>
    <text x="600" y="430" font-family="sans-serif" font-size="24" fill="#ffffff" opacity="0.8" text-anchor="middle">
      <tspan id="ogis_description">Placeholder Description</tspan>
    </text>
  </g>
</svg>