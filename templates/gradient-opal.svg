<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="50%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#e8eaf6"/>
    </linearGradient>

    <!-- Swirling, multi-focal pattern -->
    <radialGradient id="blob1" cx="30%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#a8edea" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a8edea" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob2" cx="70%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#fed6e3" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fed6e3" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob3" cx="45%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#d299c2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d299c2" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob4" cx="60%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#b2dfdb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b2dfdb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blob5" cx="25%" cy="60%" r="38%">
      <stop offset="0%" stop-color="#f8bbd9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f8bbd9" stop-opacity="0"/>
    </radialGradient>

    <filter id="noiseCoarse" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-0.3"/></feComponentTransfer>
    </filter>
    <filter id="noiseFine" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="2" intercept="-0.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#baseGradient)"/>
  <rect width="100%" height="100%" fill="url(#blob1)"/>
  <rect width="100%" height="100%" fill="url(#blob2)"/>
  <rect width="100%" height="100%" fill="url(#blob3)"/>
  <rect width="100%" height="100%" fill="url(#blob4)"/>
  <rect width="100%" height="100%" fill="url(#blob5)"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseCoarse)" opacity="0.10"/>
  <rect width="100%" height="100%" fill="#000" filter="url(#noiseFine)" opacity="0.05"/>

  <!-- Centered/Hero layout with dark text for light background -->
  <g id="ogis_logo">
    <rect x="450" y="50" width="300" height="80" rx="10" fill="rgba(100,80,120,0.1)" stroke="rgba(100,80,120,0.2)" stroke-width="1"/>
    <text x="600" y="98" font-family="sans-serif" font-weight="bold" font-size="14" fill="rgba(100,80,120,0.5)" text-anchor="middle">Placeholder Logo (300x80)</text>
  </g>
  <g>
    <text id="ogis_subtitle" x="600" y="220" font-family="sans-serif" font-size="28" font-weight="600" fill="#5d4e6d" opacity="0.9" text-anchor="middle">Placeholder Subtitle</text>
    <text x="600" y="340" font-family="sans-serif" font-size="86" font-weight="bold" fill="#3d3252" text-anchor="middle">
      <tspan id="ogis_title">Placeholder Title</tspan>
    </text>
    <text x="600" y="420" font-family="sans-serif" font-size="28" fill="#5d4e6d" opacity="0.85" text-anchor="middle">
      <tspan id="ogis_description">Placeholder Description</tspan>
    </text>
  </g>
</svg>