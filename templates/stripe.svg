<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main background - clean white/light gray -->
  <rect width="100%" height="100%" fill="#fafafa"/>

  <!-- Bold accent bar on left -->
  <rect x="0" y="0" width="12" height="630" fill="url(#accentGradient)"/>

  <!-- Logo at top-left -->
  <g id="ogis_logo">
    <rect x="80" y="80" width="400" height="120"
          rx="12"
          fill="#ffffff"
          stroke="#e5e7eb"
          stroke-width="2"/>
    <text x="280" y="145"
          font-family="sans-serif"
          font-weight="bold"
          font-size="20"
          fill="#374151"
          text-anchor="middle">
      Placeholder Logo (400×120)
    </text>
  </g>

  <!-- Image at top-right -->
  <g id="ogis_image">
    <rect x="920" y="80" width="200" height="200"
          rx="12"
          fill="#ffffff"
          stroke="#e5e7eb"
          stroke-width="2"/>
    <text x="1020" y="185"
          font-family="sans-serif"
          font-weight="bold"
          font-size="16"
          fill="#6b7280"
          text-anchor="middle">
      Image (200×200)
    </text>
  </g>

  <!-- Content at bottom-left -->
  <g transform="translate(80, 380)">
    <!-- Subtitle -->
    <text id="ogis_subtitle" x="0" y="0" font-family="sans-serif" font-size="28" fill="#6b7280">Placeholder Subtitle</text>

    <!-- Title -->
    <text x="0" y="95" font-family="sans-serif" font-size="80" font-weight="bold" fill="#111827">
      <tspan id="ogis_title" x="0" dy="0">Placeholder Title</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="150" font-family="sans-serif" font-size="28" fill="#374151">
      <tspan id="ogis_description" x="0" dy="0">Placeholder Description</tspan>
    </text>
  </g>
</svg>
