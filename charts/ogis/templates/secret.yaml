{{- if and .Values.hmac.enabled (not .Values.hmac.existingSecret) -}}
{{- if not .Values.hmac.value -}}
{{- fail "hmac.enabled is true but hmac.value is empty and no hmac.existingSecret was provided. Set hmac.value or hmac.existingSecret." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-hmac" (include "ogis.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "ogis.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ .Values.hmac.value | quote }}
{{- end }}
